<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1410" width="1600" height="1410" role="img" aria-labelledby="title desc">
<title id="title">The SDLC is a cycle of decisions, delivery and learning</title>
<desc id="desc">A clockwise cycle connects product refinement, system design, experience and contracts, planning and foundations, implementation, verification and repair, release and deployment, and operation and learning. Develop spans the cycle. Enter at the activity relevant to the request. Verification feeds repair, and evidence can reopen earlier decisions. Project foundations and selected specialist expertise support the cycle throughout. Release, deployment and live actions stay within established authority.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315f91"/></marker><marker id="feedback" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#157466"/></marker></defs>
<rect width="1600" height="1410" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, Helvetica, sans-serif">
<text x="44" y="58" font-size="36" fill="#172c41" font-weight="700" text-anchor="start" >Build, verify, learn. Repeat.</text>
<text x="44" y="94" font-size="23" fill="#52667a" font-weight="400" text-anchor="start" >Enter where the work needs it; revisit decisions when evidence changes.</text>
<rect x="44" y="124" width="1512" height="72" rx="12" fill="#eaf1f8" stroke="#c5d2df"/>
<text x="68" y="153" font-size="23" fill="#172c41" font-weight="700" text-anchor="start" >Project foundations</text>
<text x="340" y="153" font-size="21" fill="#52667a" font-weight="400" text-anchor="start" >Establish after consequential choices; maintain as the system evolves.</text>
<text x="68" y="181" font-size="20" fill="#52667a" font-weight="400" text-anchor="start" >Onboarding · configuration · tests · containers · CI · artifacts · deployment and recovery</text>
<text x="44" y="267" font-size="18" fill="#52667a" font-weight="700" text-anchor="start" >START WITH YOUR NEED</text>
<text x="44" y="301" font-size="23" fill="#172c41" font-weight="650" text-anchor="start" >A new idea</text>
<text x="44" y="332" font-size="19" fill="#52667a" font-weight="400" text-anchor="start" >Shape the outcome,</text>
<text x="44" y="359" font-size="19" fill="#52667a" font-weight="400" text-anchor="start" >then design a useful slice.</text>
<text x="44" y="464" font-size="23" fill="#172c41" font-weight="650" text-anchor="start" >An existing feature</text>
<text x="44" y="495" font-size="19" fill="#52667a" font-weight="400" text-anchor="start" >Preserve context; revisit</text>
<text x="44" y="522" font-size="19" fill="#52667a" font-weight="400" text-anchor="start" >only affected decisions.</text>
<text x="44" y="627" font-size="23" fill="#172c41" font-weight="650" text-anchor="start" >Broken behavior</text>
<text x="44" y="658" font-size="19" fill="#52667a" font-weight="400" text-anchor="start" >Reproduce, diagnose,</text>
<text x="44" y="685" font-size="19" fill="#52667a" font-weight="400" text-anchor="start" >repair and verify.</text>
<text x="44" y="790" font-size="23" fill="#172c41" font-weight="650" text-anchor="start" >A live incident</text>
<text x="44" y="821" font-size="19" fill="#52667a" font-weight="400" text-anchor="start" >Reduce impact and verify</text>
<text x="44" y="848" font-size="19" fill="#52667a" font-weight="400" text-anchor="start" >recovery; feed learning back.</text>
<text x="44" y="953" font-size="23" fill="#172c41" font-weight="650" text-anchor="start" >A focused question</text>
<text x="44" y="984" font-size="19" fill="#52667a" font-weight="400" text-anchor="start" >Request a specialist</text>
<text x="44" y="1011" font-size="19" fill="#52667a" font-weight="400" text-anchor="start" >without a full lifecycle.</text>
<text x="44" y="1136" font-size="18" fill="#52667a" font-weight="400" text-anchor="start" >People or trusted automation</text>
<text x="44" y="1161" font-size="18" fill="#52667a" font-weight="400" text-anchor="start" >Same activities; explicit scope.</text>
