<text x="30" y="77" font-size="16" fill="#526580">Choose the relevant activity; revisit decisions when evidence changes</text>
<rect x="30" y="106" width="1380" height="91" rx="14" fill="#e8eef9" stroke="#9aaecb"/>
<text x="54" y="136" font-size="20" font-weight="700" fill="#15233b">Project foundations · /setup · project-conventions</text>
<text x="54" y="166" font-size="16" fill="#354966">READMEs · configuration checks · tests · containers · CI · artifact release · deployment/recovery</text>
<rect x="30" y="230" width="315" height="122" rx="14" fill="#e8f5ef" stroke="#9aaecb"/>
<text x="48" y="264" font-size="20" font-weight="700" fill="#15233b">1. Product refinement</text>
<text x="48" y="295" font-size="15" fill="#354966">/refine · business-strategy</text>
<text x="48" y="327" font-size="14" fill="#526580">Actors, scope and acceptance</text>
