<text x="369" y="233" font-size="19" fill="#157466" font-weight="400" text-anchor="start" >Evidence can reopen earlier decisions</text>
<circle cx="900" cy="690" r="202" fill="#172c41"/>
<text x="900" y="617" font-size="42" fill="white" font-weight="700" text-anchor="middle" >develop</text>
<text x="900" y="654" font-size="22" fill="#d7e4ee" font-weight="400" text-anchor="middle" >An end-to-end engagement</text>
<text x="900" y="704" font-size="24" fill="white" font-weight="600" text-anchor="middle" >A useful, verified increment</text>
<text x="900" y="743" font-size="21" fill="#d7e4ee" font-weight="400" text-anchor="middle" >Select the relevant expertise.</text>
<text x="900" y="776" font-size="21" fill="#d7e4ee" font-weight="400" text-anchor="middle" >Keep decisions and evidence.</text>
<path d="M762.2 972.8 C815 972.8 825 987 825 1022" fill="none" stroke="#157466" stroke-width="3" marker-end="url(#feedback)"/>
<text x="779" y="931" font-size="19" fill="#157466" font-weight="400" text-anchor="start" >Repair &amp; recheck</text>
<rect x="760.0" y="235.0" width="280" height="110" rx="12" fill="#eaf1f8" stroke="#315f91"/>
<text x="900.0" y="270.0" font-size="23" fill="#315f91" font-weight="700" text-anchor="middle" >Product refinement</text>
<text x="900.0" y="301.0" font-size="18" fill="#172c41" font-weight="400" text-anchor="middle" >Problem, users, acceptance</text>
<text x="900.0" y="329.0" font-size="18" fill="#52667a" font-weight="400" text-anchor="middle" >refine · strategy</text>
<rect x="1042.8" y="352.2" width="280" height="110" rx="12" fill="#eaf1f8" stroke="#315f91"/>
<text x="1182.8" y="387.2" font-size="23" fill="#315f91" font-weight="700" text-anchor="middle" >System design</text>
<text x="1182.8" y="418.2" font-size="18" fill="#172c41" font-weight="400" text-anchor="middle" >Boundaries and tradeoffs</text>
<text x="1182.8" y="446.2" font-size="18" fill="#52667a" font-weight="400" text-anchor="middle" >design · system-design</text>
<rect x="1160.0" y="635.0" width="280" height="110" rx="12" fill="#eaf1f8" stroke="#315f91"/>
<text x="1300.0" y="670.0" font-size="23" fill="#315f91" font-weight="700" text-anchor="middle" >Experience &amp; contracts</text>
<text x="1300.0" y="701.0" font-size="18" fill="#172c41" font-weight="400" text-anchor="middle" >Behavior, states, visual direction</text>
<text x="1300.0" y="729.0" font-size="18" fill="#52667a" font-weight="400" text-anchor="middle" >design · domain guidance</text>
