<rect x="385" y="230" width="315" height="122" rx="14" fill="#eef2ff" stroke="#9aaecb"/>
<text x="403" y="264" font-size="20" font-weight="700" fill="#15233b">2. System design</text>
<text x="403" y="295" font-size="15" fill="#354966">/design · system-design</text>
<text x="403" y="327" font-size="14" fill="#526580">Architecture and platform decisions</text>
<path d="M700 291L732 291" fill="none" stroke="#526580" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="740" y="230" width="315" height="122" rx="14" fill="#eef2ff" stroke="#9aaecb"/>
<text x="758" y="264" font-size="20" font-weight="700" fill="#15233b">3. Implementation plan</text>
<text x="758" y="295" font-size="15" fill="#354966">/plan</text>
<text x="758" y="327" font-size="14" fill="#526580">Increments, tests and delivery</text>
