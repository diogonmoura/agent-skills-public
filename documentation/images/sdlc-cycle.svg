<text x="1182.8" y="952.8" font-size="23" fill="#315f91" font-weight="700" text-anchor="middle" >Plan &amp; foundations</text>
<text x="1182.8" y="983.8" font-size="18" fill="#172c41" font-weight="400" text-anchor="middle" >Increments and delivery setup</text>
<text x="1182.8" y="1011.8" font-size="18" fill="#52667a" font-weight="400" text-anchor="middle" >plan · setup</text>
<rect x="760.0" y="1035.0" width="280" height="110" rx="12" fill="#eaf1f8" stroke="#315f91"/>
<text x="900.0" y="1070.0" font-size="23" fill="#315f91" font-weight="700" text-anchor="middle" >Implementation</text>
<text x="900.0" y="1101.0" font-size="18" fill="#172c41" font-weight="400" text-anchor="middle" >Code, tests and documentation</text>
<text x="900.0" y="1129.0" font-size="18" fill="#52667a" font-weight="400" text-anchor="middle" >implement</text>
<rect x="477.20000000000005" y="917.8" width="280" height="110" rx="12" fill="#e7f3ef" stroke="#157466"/>
<text x="617.2" y="952.8" font-size="23" fill="#157466" font-weight="700" text-anchor="middle" >Verification &amp; repair</text>
<text x="617.2" y="983.8" font-size="18" fill="#172c41" font-weight="400" text-anchor="middle" >Check outcomes; repair causes</text>
<text x="617.2" y="1011.8" font-size="18" fill="#52667a" font-weight="400" text-anchor="middle" >test · review</text>
<rect x="360.0" y="635.0" width="280" height="110" rx="12" fill="#fbf0df" stroke="#8a591c"/>
<text x="500.0" y="670.0" font-size="23" fill="#8a591c" font-weight="700" text-anchor="middle" >Release &amp; deployment</text>
<text x="500.0" y="701.0" font-size="18" fill="#172c41" font-weight="400" text-anchor="middle" >Artifacts, promotion and recovery</text>
<text x="500.0" y="729.0" font-size="18" fill="#52667a" font-weight="400" text-anchor="middle" >release · authorized execution</text>
<rect x="477.20000000000005" y="352.2" width="280" height="110" rx="12" fill="#fbf0df" stroke="#8a591c"/>
<text x="617.2" y="387.2" font-size="23" fill="#8a591c" font-weight="700" text-anchor="middle" >Operate &amp; learn</text>
<text x="617.2" y="418.2" font-size="18" fill="#172c41" font-weight="400" text-anchor="middle" >Service health and product value</text>
<text x="617.2" y="446.2" font-size="18" fill="#52667a" font-weight="400" text-anchor="middle" >operations · improve</text>
<rect x="44" y="1210" width="1512" height="126" rx="12" fill="white" stroke="#c5d2df"/>
<text x="68" y="1243" font-size="25" fill="#172c41" font-weight="700" text-anchor="start" >Review and expertise throughout the cycle</text>
<text x="68" y="1279" font-size="23" fill="#52667a" font-weight="400" text-anchor="start" >Security &amp; privacy · licensing &amp; usage · documentation · Git · reliability · observability</text>
<text x="68" y="1312" font-size="21" fill="#52667a" font-weight="400" text-anchor="start" >Choose frontend, backend, native, AI and other specialists for the actual work and stack.</text>
<text x="44" y="1375" font-size="21" fill="#52667a" font-weight="400" text-anchor="start" >Investigate facts · ask about consequential choices · verify claimed outcomes · act within established authority</text>
</g></svg>
