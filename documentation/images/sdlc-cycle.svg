<text x="40" y="78" font-size="15" fill="#526580">Enter at the relevant phase · Reuse accepted decisions · Follow evidence back to the affected work</text>
<rect x="340" y="110" width="740" height="175" rx="18" fill="#e8eef9" stroke="#9aaecb"/>
<text x="710" y="145" text-anchor="middle" font-size="20" font-weight="700" fill="#15233b">Project foundations: establish and maintain</text>
<text x="710" y="175" text-anchor="middle" font-size="15" fill="#354966">After sufficient product and architecture decisions · setup / project-conventions</text>
<text x="710" y="205" text-anchor="middle" font-size="15" fill="#354966">READMEs · local setup · linting · tests · application containers</text>
<text x="710" y="237" text-anchor="middle" font-size="14" fill="#526580">CI/CD · artifact publication · release / deployment / recovery procedures</text>
<text x="710" y="263" text-anchor="middle" font-size="13" fill="#526580">delivery-pipelines · Maintain applicable foundations as the project evolves</text>
