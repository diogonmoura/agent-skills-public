<rect x="1095" y="230" width="315" height="122" rx="14" fill="#eef2ff" stroke="#9aaecb"/>
<text x="1113" y="264" font-size="20" font-weight="700" fill="#15233b">4. Interaction design</text>
<text x="1113" y="295" font-size="15" fill="#354966">/design · interaction-design</text>
<text x="1113" y="327" font-size="14" fill="#526580">UI behavior and API contracts</text>
