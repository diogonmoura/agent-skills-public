<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc">
<title id="title">Product refinement, system design and the development lifecycle</title>
<desc id="desc">Product refinement leads to system design, implementation planning, interaction design, implementation, testing and repair, release and deployment, then maintenance and learning. Project foundations and supporting skills apply throughout.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526580"/></marker></defs>
<rect width="1440" height="790" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif">
