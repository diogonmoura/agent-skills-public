<text x="48" y="464" font-size="20" font-weight="700" fill="#15233b">8. Maintenance and learning</text>
<text x="48" y="495" font-size="15" fill="#354966">/improve · /dependencies</text>
<text x="48" y="527" font-size="14" fill="#526580">Operations and product feedback</text>
<path d="M187 554V604H720V636" fill="none" stroke="#526580" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="30" y="636" width="1380" height="120" rx="14" fill="#f0edf9" stroke="#c4bddb"/>
<text x="54" y="670" font-size="20" font-weight="700" fill="#15233b">Across the lifecycle · /develop · /review · /harden</text>
<text x="54" y="702" font-size="16" fill="#354966">Research · domain/interfaces · security · documentation · Git · reliability · observability</text>
<text x="54" y="733" font-size="15" fill="#526580">Product feedback and operational learning reopen refinement, architecture or the affected increment</text>
</g></svg>
