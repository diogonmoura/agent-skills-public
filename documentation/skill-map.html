<title>Skill Constellation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Interactive map of every skill in the collection and how the skills load, mention and route to each other.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* layout: full-bleed radar field on the left, telemetry console on the right; stacks vertically on phones */
:root {
  --bg: #04080c;
  --bg-2: #08131b;
  --grid: #0e2330;
  --line: #17384a;
  --fg: #d9f1f7;
  --dim: #6f909c;
  --faint: #3a5866;
  --accent: #4fe3ff;
  --warm: #ffb547;
  --panel: rgba(7, 18, 26, 0.9);
  --display: "Chakra Petch", "Rajdhani", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(ellipse at 38% 50%, #0a1c27 0%, var(--bg) 62%) fixed, var(--bg);
  color: var(--fg);
  font: 14px/1.5 var(--body);
  overflow: hidden;
}
.shell {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 380px;
  gap: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box;
}
.stage { position: relative; min-width: 0; min-height: 0; }
svg#map { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
svg#map:active { cursor: grabbing; }

.hud-corner { position: absolute; font: 500 11px/1.4 var(--mono); color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase; pointer-events: none; }
.hud-corner.tl { top: 4px; left: 4px; }
.hud-corner.bl { bottom: 4px; left: 4px; }
.hud-corner b { color: var(--accent); font-weight: 500; }
.zoom-ctl { position: absolute; right: 4px; bottom: 4px; display: flex; gap: 6px; }
.zoom-ctl button, .chip-btn {
  font: 500 12px var(--mono); color: var(--fg); background: var(--panel);
  border: 1px solid var(--line); border-radius: 3px; padding: 5px 9px; cursor: pointer;
}
.zoom-ctl button:hover, .chip-btn:hover { border-color: var(--accent); color: var(--accent); }
button:focus-visible, input:focus-visible, .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* console */
.console {
  min-width: 0; min-height: 0; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--line);
  clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
  padding: 18px 18px 24px; display: flex; flex-direction: column; gap: 18px;
}
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand h1 { font: 700 22px/1.1 var(--display); letter-spacing: 0.14em; text-transform: uppercase; margin: 0; color: var(--fg); text-wrap: balance; }
.brand p { margin: 0; color: var(--dim); font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.stat { background: var(--bg-2); padding: 8px 8px 6px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font: 600 20px/1 var(--display); color: var(--accent); font-variant-numeric: tabular-nums; }
.stat span { font: 500 10px/1.2 var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; }

.label { font: 600 11px var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: 0.12em; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.label em { font-style: normal; color: var(--faint); letter-spacing: 0.04em; text-transform: none; }

.search { position: relative; }
.search input {
  width: 100%; box-sizing: border-box; background: var(--bg); color: var(--fg);
  border: 1px solid var(--line); border-radius: 3px; padding: 9px 10px 9px 30px; font: 14px var(--body);
}
.search::before { content: "›"; position: absolute; left: 11px; top: 6px; color: var(--accent); font: 600 18px var(--mono); }
.results { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; max-height: 220px; overflow-y: auto; }

.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.fam {
  display: inline-flex; align-items: center; gap: 6px; font: 500 12px var(--body); color: var(--fg);
  background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 8px; cursor: pointer;
}
.fam i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.fam[aria-pressed="false"] { opacity: 0.35; }
.edges { display: flex; flex-direction: column; gap: 6px; }
.edge-row { display: grid; grid-template-columns: 18px 44px 1fr; align-items: center; gap: 8px; font-size: 13px; color: var(--fg); cursor: pointer; }
.edge-row input { margin: 0; accent-color: var(--accent); }
.edge-row small { color: var(--dim); display: block; font-size: 12px; line-height: 1.35; }

.card { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.card h2 { font: 600 20px/1.15 var(--display); margin: 0; letter-spacing: 0.04em; overflow-wrap: anywhere; }
.card .desc { margin: 0; color: #b9d3dc; font-size: 13.5px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font: 500 11px var(--mono); padding: 2px 7px; border: 1px solid var(--line); border-radius: 2px; color: var(--dim); }
.tag.plugin { color: var(--c); border-color: color-mix(in srgb, var(--c) 45%, transparent); }
.tag.task { color: var(--warm); border-color: color-mix(in srgb, var(--warm) 45%, transparent); }
.links { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.link {
  display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 8px;
  width: 100%; text-align: left; background: transparent; border: 0; border-left: 2px solid transparent;
  color: var(--fg); font: 13px var(--body); padding: 4px 6px; cursor: pointer; border-radius: 0 3px 3px 0;
}
.link:hover { background: rgba(79, 227, 255, 0.06); border-left-color: var(--accent); }
.link i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.link span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link small { font: 11px var(--mono); color: var(--dim); }
.empty { color: var(--faint); font-size: 13px; margin: 0; }
.hint { color: var(--dim); font-size: 12.5px; margin: 0; }
.hint kbd { font: 11px var(--mono); border: 1px solid var(--line); border-radius: 2px; padding: 0 4px; color: var(--fg); }

/* map marks */
.ring { fill: none; stroke: var(--grid); }
.ring.major { stroke: var(--line); stroke-dasharray: 2 6; }
.spoke { stroke: var(--grid); }
.core-spin { transform-box: fill-box; transform-origin: center; animation: spin 60s linear infinite; }
.core-spin.rev { animation-duration: 90s; animation-direction: reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
.sweep { transform-origin: 0 0; animation: spin 14s linear infinite; }
.member { stroke-width: 0.6; stroke-opacity: 0.18; }
.e { fill: none; stroke-width: 1.1; stroke-opacity: 0.38; }
.e.mentions { stroke-dasharray: 3 3; }
.e.routes { stroke-dasharray: 1 4; stroke-linecap: round; stroke-width: 1.4; }
.e.cross { stroke-opacity: 0.6; }
.node circle.body { stroke: var(--bg); stroke-width: 1.2; }
.node circle.halo { fill: none; stroke-width: 1; stroke-opacity: 0.7; }
.node { cursor: pointer; }
.node text, .hub text {
  font: 500 9px var(--body); fill: var(--fg); paint-order: stroke; stroke: var(--bg); stroke-width: 3px;
  pointer-events: none; opacity: 0; transition: opacity 0.2s;
}
.node.big text, .show-labels .node text { opacity: 0.85; }
.hub { cursor: pointer; }
.hub text { font: 600 11px var(--display); letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.9; }
.hub polygon { fill: var(--bg); stroke-width: 1.4; }
.hub .count { font: 500 8px var(--mono); letter-spacing: 0; text-transform: none; fill: var(--dim); }

.focus .node, .focus .ring-hub, .focus .e, .focus .member { opacity: 0.08; transition: opacity 0.25s; }
.focus .on { opacity: 1 !important; }
.focus .node.on text { opacity: 1; }
.focus .e.on { stroke-opacity: 0.95; stroke-width: 1.8; animation: flow 1s linear infinite; }
.focus .e.mentions.on { stroke-dasharray: 5 4; }
.focus .e.loads.on { stroke-dasharray: 9 4; }
.focus .member.on { stroke-opacity: 0.4; }
@keyframes flow { to { stroke-dashoffset: -13; } }
.node.sel circle.halo { stroke-opacity: 1; stroke-width: 2; }
.fam-off { display: none; }

@media (prefers-reduced-motion: reduce) {
  .core-spin, .sweep, .focus .e.on { animation: none; }
}
@media (max-width: 860px) {
  body { overflow: auto; }
  .shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: 62vh auto; height: auto; }
  .stage { height: 62vh; }
  .console { overflow: visible; }
  .hud-corner.bl { display: none; }
}
</style>

<div class="shell">
  <div class="stage">
    <svg id="map" viewBox="-640 -640 1280 1280" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map of skills grouped by plugin, with lines for references between skills">
      <defs>
        <radialGradient id="sweepGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="scale(600)">
          <stop offset="0" stop-color="#4fe3ff" stop-opacity="0"></stop>
          <stop offset="1" stop-color="#4fe3ff" stop-opacity="0.07"></stop>
        </radialGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2.4" result="b"></feGaussianBlur>
          <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
        </filter>
      </defs>
      <g id="viewport">
        <g id="backdrop"></g>
        <g id="members"></g>
        <g id="edges"></g>
        <g id="hubs"></g>
        <g id="nodes"></g>
      </g>
    </svg>
    <div class="hud-corner tl">Skill graph · <b id="statusLine">online</b></div>
    <div class="hud-corner bl" id="hoverLine">Hover a node · click to lock</div>
    <div class="zoom-ctl">
      <button type="button" id="zin" aria-label="Zoom in">+</button>
      <button type="button" id="zout" aria-label="Zoom out">−</button>
      <button type="button" id="zreset">Reset</button>
      <button type="button" id="labels" aria-pressed="false">Labels</button>
    </div>
  </div>

  <aside class="console">
    <div class="brand">
      <h1>Skill Constellation</h1>
      <p>Every skill in agent-skills-public, grouped by plugin. Lines show where one skill loads, names or routes to another.</p>
    </div>
    <div class="stats" id="stats"></div>

    <div>
      <p class="label"><label for="q">Find a skill</label><em><kbd>/</kbd> to focus</em></p>
      <div class="search"><input id="q" type="search" autocomplete="off" placeholder="e.g. interface-design"></div>
      <ul class="results links" id="results"></ul>
    </div>

    <div>
      <p class="label">Plugin families <em>tap to hide</em></p>
      <div class="legend" id="legend"></div>
    </div>

    <div>
      <p class="label">Connections</p>
      <div class="edges" id="edgeToggles"></div>
    </div>

    <section class="card" id="card" aria-live="polite"></section>
  </aside>
</div>

  { key: "platform", label: "Data & platforms", color: "#86b2ff", plugins: ["development-tooling", "operations-platforms", "database-development", "database-postgresql-development"] },

];
const EDGE_KINDS = [
  { key: "loads", label: "Loads", note: "Links straight to the other skill's instructions" },
  { key: "mentions", label: "Names", note: "Names the other skill as a next step or alternative" },
  { key: "routes", label: "Routes", note: "A plugin's task guide sends work to a skill in another plugin" },
];

/* ---------- model ---------- */
const famOf = {};
FAMILIES.forEach(f => f.plugins.forEach(p => famOf[p] = f));
Object.keys(DATA.plugins).forEach(p => { if (!famOf[p]) { famOf[p] = FAMILIES[0]; FAMILIES[0].plugins.push(p); } });
const color = p => famOf[p].color;

const CORE = "development"; // the default plugin sits in the reactor core; its skills orbit it
const pluginOrder = FAMILIES.flatMap(f => f.plugins.filter(p => DATA.plugins[p] && p !== CORE));
const skillsBy = {};
DATA.skills.forEach(s => (skillsBy[s.plugin] ||= []).push(s));

const R = 470;
const totalWeight = pluginOrder.reduce((a, p) => a + Math.sqrt((skillsBy[p] || []).length) + 1.6, 0);
let acc = 0;
const hubs = pluginOrder.map(p => {
  const w = Math.sqrt((skillsBy[p] || []).length) + 1.6;
  const angle = ((acc + w / 2) / totalWeight) * Math.PI * 2 - Math.PI / 2;
  acc += w;
  const n = (skillsBy[p] || []).length;
  return { id: "p:" + p, plugin: p, type: "hub", angle, n, x: Math.cos(angle) * R, y: Math.sin(angle) * R, fx: Math.cos(angle) * R, fy: Math.sin(angle) * R };
});
if (DATA.plugins[CORE]) hubs.push({ id: "p:" + CORE, plugin: CORE, type: "hub", core: true, angle: -Math.PI / 2, n: (skillsBy[CORE] || []).length, x: 0, y: 0, fx: 0, fy: 0 });
const hubBy = Object.fromEntries(hubs.map(h => [h.plugin, h]));

const nodes = DATA.skills.map(s => ({ ...s, type: "skill", out: [], inc: [], routedFrom: [] }));
const nodeBy = Object.fromEntries(nodes.map(n => [n.id, n]));

const links = DATA.edges
  .filter(e => nodeBy[e.source] && nodeBy[e.target])
  .map(e => ({ ...e, cross: nodeBy[e.source].plugin !== nodeBy[e.target].plugin }));
links.forEach(l => { nodeBy[l.source].out.push(l); nodeBy[l.target].inc.push(l); });

const routes = [];
const seenRoute = new Set();
DATA.routes.forEach(r => {
  const t = nodeBy[r.target];
  if (!t || !hubBy[r.plugin]) return;
  if (!t.routedFrom.some(x => x.plugin === r.plugin && x.doc === r.doc)) t.routedFrom.push(r);
  if (t.plugin === r.plugin) return;
  const k = r.plugin + ">" + r.target;
  if (seenRoute.has(k)) return;
  seenRoute.add(k);
  routes.push({ source: "p:" + r.plugin, target: r.target, kind: "routes", cross: true, plugin: r.plugin });
});
nodes.forEach(n => { n.deg = n.out.length + n.inc.length; n.r = 3.2 + Math.sqrt(n.inc.length * 2 + n.out.length) * 1.7; });

/* ---------- layout: settle once, then draw a still frame ---------- */
nodes.forEach(n => {
  const h = hubBy[n.plugin];
  const jitter = (Math.random() - 0.5) * 30;
  if (h.core) { const a = Math.random() * Math.PI * 2; n.x = Math.cos(a) * 170; n.y = Math.sin(a) * 170; }
  else { n.x = h.x * 0.82 + jitter; n.y = h.y * 0.82 + jitter; }
});
const all = [...nodes, ...hubs];
const onRing = d => d.type === "skill" && !hubBy[d.plugin].core;
const sim = d3.forceSimulation(all)
  .force("charge", d3.forceManyBody().strength(d => d.type === "hub" ? -120 : -26).distanceMax(220))
  .force("toHubX", d3.forceX(d => onRing(d) ? hubBy[d.plugin].x * 0.8 : 0).strength(d => onRing(d) ? 0.16 : 0))
  .force("toHubY", d3.forceY(d => onRing(d) ? hubBy[d.plugin].y * 0.8 : 0).strength(d => onRing(d) ? 0.16 : 0))
  .force("orbit", d3.forceRadial(175, 0, 0).strength(d => d.type === "skill" && hubBy[d.plugin].core ? 0.35 : 0))
  .force("links", d3.forceLink(links.map(l => ({ source: l.source, target: l.target }))).id(d => d.id).strength(0.015).distance(120))
  .force("collide", d3.forceCollide(d => d.type === "hub" ? (d.core ? 96 : 26) : d.r + 5).iterations(3))
  .stop();
for (let i = 0; i < 400; i++) sim.tick();
nodes.forEach(n => { if (Math.hypot(n.x, n.y) < 100) { const a = Math.atan2(n.y, n.x); n.x = Math.cos(a) * 105; n.y = Math.sin(a) * 105; } });

/* ---------- draw ---------- */
const svg = d3.select("#map");
const vp = d3.select("#viewport");

const bd = d3.select("#backdrop");
[90, 180, 300, 420, 540].forEach((r, i) => bd.append("circle").attr("class", "ring" + (i % 2 ? " major" : "")).attr("r", r));
for (let a = 0; a < 360; a += 15) {
  const t = a * Math.PI / 180;
  bd.append("line").attr("class", "spoke").attr("x1", Math.cos(t) * 90).attr("y1", Math.sin(t) * 90).attr("x2", Math.cos(t) * 600).attr("y2", Math.sin(t) * 600).attr("stroke-opacity", a % 45 ? 0.35 : 0.8);
}
bd.append("path").attr("class", "sweep").attr("d", d3.arc()({ innerRadius: 90, outerRadius: 600, startAngle: 0, endAngle: Math.PI / 5 })).attr("fill", "url(#sweepGrad)");
const core = d3.select("#hubs").append("g").attr("class", "hub core-hub fam-workflow").attr("tabindex", 0).attr("role", "button").attr("aria-label", "Plugin development (core)");
core.append("circle").attr("r", 66).attr("fill", "#061019").attr("stroke", "#4fe3ff").attr("stroke-opacity", 0.5);
core.append("circle").attr("class", "core-spin").attr("r", 76).attr("fill", "none").attr("stroke", "#4fe3ff").attr("stroke-width", 2).attr("stroke-dasharray", "30 8 4 8").attr("stroke-opacity", 0.55);
core.append("circle").attr("class", "core-spin rev").attr("r", 84).attr("fill", "none").attr("stroke", "#ffb547").attr("stroke-width", 1).attr("stroke-dasharray", "2 10").attr("stroke-opacity", 0.6);
core.append("text").attr("text-anchor", "middle").attr("y", 6).attr("fill", "#d9f1f7").style("font", "700 34px var(--display)").text(nodes.length);
core.append("text").attr("text-anchor", "middle").attr("y", 24).attr("fill", "#6f909c").style("font", "500 9px var(--mono)").style("letter-spacing", "0.18em").text("SKILLS ONLINE");
core.append("text").attr("text-anchor", "middle").attr("y", -30).attr("fill", "#4fe3ff").style("font", "600 10px var(--display)").style("letter-spacing", "0.16em").text("DEVELOPMENT · " + (skillsBy[CORE] || []).length);

d3.select("#members").selectAll("line").data(nodes).join("line")
  .attr("class", d => "member fam-" + famOf[d.plugin].key)
  .attr("x1", d => d.x).attr("y1", d => d.y)
  .attr("x2", d => hubBy[d.plugin].x).attr("y2", d => hubBy[d.plugin].y)
  .attr("stroke", d => color(d.plugin));

function curve(a, b) {
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const dist = Math.hypot(b.x - a.x, b.y - a.y);
  const pull = Math.min(0.55, dist / 900);
  const cx = mx * (1 - pull), cy = my * (1 - pull);
  return `M${a.x},${a.y}Q${cx},${cy} ${b.x},${b.y}`;
}
const allEdges = [...links, ...routes];
const edgeSel = d3.select("#edges").selectAll("path").data(allEdges).join("path")
  .attr("class", d => `e ${d.kind}${d.cross ? " cross" : ""}`)
  .attr("d", d => curve(d.kind === "routes" ? hubBy[d.plugin] : nodeBy[d.source], nodeBy[d.target]))
  .attr("stroke", d => d.kind === "routes" ? color(d.plugin) : color(nodeBy[d.source].plugin));

const hubSel = d3.select("#hubs").selectAll("g.ring-hub").data(hubs.filter(h => !h.core)).join("g")
  .attr("class", d => "hub ring-hub fam-" + famOf[d.plugin].key)
  .attr("transform", d => `translate(${d.x},${d.y})`)
  .attr("tabindex", 0).attr("role", "button").attr("aria-label", d => `Plugin ${d.plugin}`);
hubSel.append("polygon").attr("points", "0,-13 11.3,-6.5 11.3,6.5 0,13 -11.3,6.5 -11.3,-6.5").attr("stroke", d => color(d.plugin)).attr("filter", "url(#glow)");
hubSel.append("text").attr("class", "count").attr("text-anchor", "middle").attr("y", 3).text(d => d.n);
hubSel.append("text")
  .attr("text-anchor", d => Math.cos(d.angle) > 0.3 ? "start" : Math.cos(d.angle) < -0.3 ? "end" : "middle")
  .attr("x", d => Math.cos(d.angle) * 20).attr("y", d => Math.sin(d.angle) * 22 + 4)
  .attr("fill", d => color(d.plugin))
  .text(d => d.plugin.replace(/-development$/, "").replace(/-/g, " "));

const nodeSel = d3.select("#nodes").selectAll("g").data(nodes).join("g")
  .attr("class", d => `node fam-${famOf[d.plugin].key}${d.inc.length >= 4 ? " big" : ""}`)
  .attr("transform", d => `translate(${d.x},${d.y})`)
  .attr("tabindex", 0).attr("role", "button").attr("aria-label", d => `Skill ${d.name}`);
nodeSel.filter(d => d.role === "task").append("circle").attr("class", "halo").attr("r", d => d.r + 3.5).attr("stroke", "#ffb547");
nodeSel.append("circle").attr("class", "body").attr("r", d => d.r).attr("fill", d => color(d.plugin)).attr("fill-opacity", d => d.upstream ? 0.55 : 1);
nodeSel.append("text").attr("x", d => d.r + 4).attr("y", 3).text(d => d.name);

/* ---------- zoom ---------- */
const zoom = d3.zoom().scaleExtent([0.6, 6]).on("zoom", ev => {
  vp.attr("transform", ev.transform);
  svg.classed("show-labels", labelsOn || ev.transform.k > 1.8);
});
svg.call(zoom).on("dblclick.zoom", null);
let labelsOn = false;
d3.select("#zin").on("click", () => svg.transition().duration(300).call(zoom.scaleBy, 1.5));
d3.select("#zout").on("click", () => svg.transition().duration(300).call(zoom.scaleBy, 1 / 1.5));
d3.select("#zreset").on("click", () => { select(null); svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity); });
d3.select("#labels").on("click", function () {
  labelsOn = !labelsOn; this.setAttribute("aria-pressed", labelsOn);
  svg.classed("show-labels", labelsOn || d3.zoomTransform(svg.node()).k > 1.8);
});

/* ---------- focus ---------- */
const edgeOn = { loads: true, mentions: true, routes: true };
const famOn = Object.fromEntries(FAMILIES.map(f => [f.key, true]));
let selected = null;

function neighborhood(d) {
  const ids = new Set([d.id]);
  const es = new Set();
  if (d.type === "hub") {
    nodes.filter(n => n.plugin === d.plugin).forEach(n => {
      ids.add(n.id);
      [...n.out, ...n.inc].forEach(l => { if (edgeOn[l.kind]) { es.add(l); ids.add(l.source); ids.add(l.target); } });
    });
    routes.filter(r => r.plugin === d.plugin || nodeBy[r.target].plugin === d.plugin).forEach(r => { if (edgeOn.routes) { es.add(r); ids.add(r.target); ids.add(r.source); } });
  } else {
    [...d.out, ...d.inc].forEach(l => { if (edgeOn[l.kind]) { es.add(l); ids.add(l.source); ids.add(l.target); } });
    routes.filter(r => r.target === d.id).forEach(r => { if (edgeOn.routes) { es.add(r); ids.add(r.source); } });
    ids.add("p:" + d.plugin);
  }
  return { ids, es };
}
function highlight(d) {
  svg.classed("focus", !!d);
  if (!d) { nodeSel.classed("on", false); d3.selectAll("#hubs .hub").classed("on", false); edgeSel.classed("on", false); d3.selectAll(".member").classed("on", false); return; }
  const { ids, es } = neighborhood(d);
  nodeSel.classed("on", n => ids.has(n.id));
  d3.selectAll("#hubs .hub").classed("on", h => ids.has(h.id));
  edgeSel.classed("on", e => es.has(e));
  d3.selectAll(".member").classed("on", n => d.type === "hub" ? n.plugin === d.plugin : n.id === d.id);
}
function select(d) {
  selected = d;
  nodeSel.classed("sel", n => d && n.id === d.id);
  highlight(d);
  renderCard();
}
function focusOn(d) {
  select(d);
  const t = d3.zoomTransform(svg.node());
  const k = Math.max(t.k, 1.6);
  svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity.scale(k).translate(-d.x, -d.y));
}
const hoverLine = document.getElementById("hoverLine");
function hoverText(d) {
  return d.type === "hub"
    ? `${d.plugin} · ${d.n} skills`
    : `${d.name} · uses ${d.out.length} · used by ${d.inc.length}`;
}
core.datum(hubBy[CORE]);
const allHubSel = d3.selectAll("#hubs .hub");
[nodeSel, allHubSel].forEach(sel => sel
  .on("mouseenter", (ev, d) => { hoverLine.textContent = hoverText(d); if (!selected) highlight(d); })
  .on("mouseleave", () => { hoverLine.textContent = "Hover a node · click to lock"; highlight(selected); })
  .on("click", (ev, d) => { ev.stopPropagation(); select(selected && selected.id === d.id ? null : d); })
  .on("keydown", (ev, d) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(d); } }));
svg.on("click", () => select(null));

/* ---------- console ---------- */
const crossCount = links.filter(l => l.cross).length;
const isolated = nodes.filter(n => n.deg === 0 && !routes.some(r => r.target === n.id)).length;
document.getElementById("stats").innerHTML = [
  [nodes.length, "skills"], [hubs.length, "plugins"], [links.length, "skill links"], [crossCount + routes.length, "cross-plugin"],
].map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");

const legend = d3.select("#legend").selectAll("button").data(FAMILIES).join("button")
  .attr("type", "button").attr("class", "fam").attr("aria-pressed", "true").style("--c", d => d.color)
  .html(d => `<i></i>${d.label}`)
  .on("click", function (ev, f) {
    famOn[f.key] = !famOn[f.key];
    this.setAttribute("aria-pressed", famOn[f.key]);
    d3.selectAll(".fam-" + f.key).classed("fam-off", !famOn[f.key]);
    edgeSel.classed("fam-off", e => {
      const a = e.kind === "routes" ? famOf[e.plugin].key : famOf[nodeBy[e.source].plugin].key;
      return !famOn[a] || !famOn[famOf[nodeBy[e.target].plugin].key] || !edgeOn[e.kind];
    });
  });

const toggles = d3.select("#edgeToggles").selectAll("label").data(EDGE_KINDS).join("label").attr("class", "edge-row");
toggles.append("input").attr("type", "checkbox").attr("id", d => "edge-" + d.key).property("checked", true)
  .on("change", function (ev, k) {
    edgeOn[k.key] = this.checked;
    edgeSel.filter(e => e.kind === k.key).classed("fam-off", !this.checked);
    highlight(selected);
  });
toggles.append("svg").attr("width", 44).attr("height", 10).append("line")
  .attr("x1", 0).attr("x2", 44).attr("y1", 5).attr("y2", 5).attr("stroke", "#4fe3ff").attr("stroke-width", d => d.key === "routes" ? 2 : 1.5)
  .attr("stroke-linecap", "round").attr("stroke-dasharray", d => d.key === "loads" ? null : d.key === "mentions" ? "3 3" : "1 4");
toggles.append("span").html(d => `${d.label}<small>${d.note}</small>`);

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function linkItem(n, extra) {
  return `<li><button type="button" class="link" data-id="${esc(n.id)}" style="--c:${color(n.plugin)}"><i></i><span>${esc(n.name || n.plugin)}</span><small>${esc(extra)}</small></button></li>`;
}
function list(title, items, emptyText) {
  return `<div><p class="label">${title} <em>${items.length}</em></p>${items.length ? `<ul class="links">${items.join("")}</ul>` : `<p class="empty">${emptyText}</p>`}</div>`;
}
const short = p => p.replace(/-development$/, "");

function renderCard() {
  const card = document.getElementById("card");
  const d = selected;
  if (!d) {
    const top = [...nodes].sort((a, b) => b.inc.length - a.inc.length || b.deg - a.deg).slice(0, 8);
    const hubsOut = [...nodes].sort((a, b) => b.out.length - a.out.length).slice(0, 5);
    card.innerHTML = `
      <p class="hint">Click any node to lock onto it and trace its connections. Hexagons are plugins, dots are skills. An amber ring marks a task you start; a faded dot is acquired from an upstream source.</p>
      ${list("Load-bearing skills", top.map(n => linkItem(n, `← ${n.inc.length}`)), "")}
      ${list("Orchestrators", hubsOut.map(n => linkItem(n, `→ ${n.out.length}`)), "")}
      <p class="hint">${isolated} skills stand alone: no other skill or guide points at them, and they point at none. They load on their own description.</p>`;
  } else if (d.type === "hub") {
    const own = nodes.filter(n => n.plugin === d.plugin).sort((a, b) => b.deg - a.deg);
    const outside = new Map();
    own.forEach(n => n.out.filter(l => l.cross).forEach(l => outside.set(l.target, nodeBy[l.target])));
    routes.filter(r => r.plugin === d.plugin).forEach(r => outside.set(r.target, nodeBy[r.target]));
    const inbound = new Map();
    own.forEach(n => n.inc.filter(l => l.cross).forEach(l => inbound.set(l.source, nodeBy[l.source])));
    const meta = DATA.plugins[d.plugin] || {};
    card.innerHTML = `
      <div class="tags"><span class="tag plugin" style="--c:${color(d.plugin)}">${esc(famOf[d.plugin].label)}</span><span class="tag">plugin · v${esc(meta.version || "?")}</span></div>
      <h2>${esc(d.plugin)}</h2>
      <p class="desc">${esc(meta.description || "")}</p>
      ${list("Skills inside", own.map(n => linkItem(n, `${n.role === "task" ? "task · " : ""}${n.deg}`)), "No skills")}
      ${list("Reaches into other plugins", [...outside.values()].map(n => linkItem(n, short(n.plugin))), "Self-contained")}
      ${list("Called from other plugins", [...inbound.values()].map(n => linkItem(n, short(n.plugin))), "Nothing outside points here")}`;
  } else {
    const uses = d.out.map(l => linkItem(nodeBy[l.target], l.kind === "loads" ? "loads" : "names"));
    const usedBy = d.inc.map(l => linkItem(nodeBy[l.source], l.kind === "loads" ? "loads" : "names"));
    const routed = d.routedFrom.map(r => `<li><button type="button" class="link" data-id="p:${esc(r.plugin)}" style="--c:${color(r.plugin)}"><i></i><span>${esc(r.plugin)}</span><small>${esc(r.doc)}</small></button></li>`);
    card.innerHTML = `
      <div class="tags">
        <span class="tag plugin" style="--c:${color(d.plugin)}">${esc(d.plugin)}</span>
        <span class="tag ${d.role === "task" ? "task" : ""}">${esc(d.role)}</span>
        <span class="tag">${esc(d.scope)}</span>
        <span class="tag">invoked by ${esc(d.invocation === "both" ? "user or agent" : d.invocation)}</span>
        ${d.upstream ? `<span class="tag">upstream · ${esc(d.upstream)}</span>` : `<span class="tag">authored here</span>`}
      </div>
      <h2>${esc(d.name)}</h2>
      <p class="desc">${esc(d.description)}</p>
      ${list("Uses →", uses, "Points at no other skill")}
      ${list("Used by ←", usedBy, "No skill points here")}
      ${list("Routed from plugin guides", routed, "Not named in any plugin guide")}`;
  }
  card.querySelectorAll("[data-id]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.id;
    const target = id.startsWith("p:") ? hubBy[id.slice(2)] : nodeBy[id];
    if (target) focusOn(target);
  }));
}

/* ---------- search ---------- */
const q = document.getElementById("q");
const results = document.getElementById("results");
q.addEventListener("input", () => {
  const v = q.value.trim().toLowerCase();
  if (!v) { results.innerHTML = ""; return; }
  const hits = [...hubs.filter(h => h.plugin.includes(v)), ...nodes.filter(n => n.name.includes(v) || n.description.toLowerCase().includes(v))]
    .sort((a, b) => ((a.name || a.plugin).startsWith(v) ? -1 : 0) - ((b.name || b.plugin).startsWith(v) ? -1 : 0))
    .slice(0, 12);
  results.innerHTML = hits.length
    ? hits.map(n => n.type === "hub" ? `<li><button type="button" class="link" data-id="${esc(n.id)}" style="--c:${color(n.plugin)}"><i></i><span>${esc(n.plugin)}</span><small>plugin</small></button></li>` : linkItem(n, short(n.plugin))).join("")
    : `<li class="empty">No skill matches “${esc(v)}”.</li>`;
  results.querySelectorAll("[data-id]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.id;
    focusOn(id.startsWith("p:") ? hubBy[id.slice(2)] : nodeBy[id]);
  }));
});
q.addEventListener("keydown", ev => { if (ev.key === "Enter") { const b = results.querySelector("[data-id]"); if (b) b.click(); } });
document.addEventListener("keydown", ev => {
  if (ev.key === "/" && document.activeElement !== q) { ev.preventDefault(); q.focus(); }
  if (ev.key === "Escape") { select(null); }
});

document.getElementById("statusLine").textContent = `${hubs.length} plugins · ${nodes.length} skills`;
renderCard();
</script>
