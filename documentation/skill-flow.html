<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* layout: lifecycle drawn as a loop (top row left to right, bottom row right to left) with a detail console on the right; one column on phones */
:root {
  --bg: #060b10;
  --surface: #0b1620;
  --surface-2: #0f1d29;
  --line: #1b3242;
  --fg: #dcecf2;
  --dim: #7a97a3;
  --faint: #44606c;
  --accent: #5fd8ff;
  --task: #ffb547;
  --display: "Chakra Petch", "Rajdhani", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--body); overflow: hidden; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.shell {
  height: 100%; box-sizing: border-box;
  display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px;
}
main { min-width: 0; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-bottom: 8px; }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
.title h1 { margin: 0; font: 700 24px/1.1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; }
.title p { margin: 2px 0 0; color: var(--dim); font-size: 13px; max-width: 62ch; }
.search { position: relative; width: min(280px, 100%); }
.search input { width: 100%; box-sizing: border-box; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; font: 13.5px var(--body); }
.search ul { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; max-height: 260px; overflow-y: auto; }
.search li button { width: 100%; text-align: left; background: none; border: 0; padding: 5px 8px; border-radius: 3px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.search li button:hover, .search li button.kb { background: rgba(95, 216, 255, 0.08); }
.search small { color: var(--dim); font: 11px var(--mono); }

.paths { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.path-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.path-row .lbl { font: 600 11px var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: 0.12em; margin-right: 6px; }
.pbtn { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.pbtn:hover { border-color: var(--accent); }
.pbtn[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
.play { margin-left: auto; display: inline-flex; gap: 6px; }
.play button { background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; cursor: pointer; font: 500 12px var(--mono); }
.play button:disabled { opacity: 0.35; cursor: default; }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.steps[hidden] { display: none; }
.step { text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.step b { font: 600 12px var(--mono); color: var(--accent); }
.step span { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; }
.step.now { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.step .entry { display: block; }

/* board */
.board {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 34px; row-gap: 0;
  grid-template-areas:
    "direction requirements design plan"
    "up dev dev down"
    "maintenance release verify implement"
    "across across across across";
}
.card {
  position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0;
  transition: opacity 0.25s, border-color 0.25s, box-shadow 0.25s;
}
.card-head { display: flex; align-items: baseline; gap: 8px; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.card-head:hover h3 { color: var(--accent); }
.num { font: 500 11px var(--mono); color: var(--faint); }
.card h3 { margin: 0; font: 600 15px/1.2 var(--display); letter-spacing: 0.06em; text-transform: uppercase; }
.handoff { margin: auto 0 0; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 11.5px; color: var(--dim); line-height: 1.35; }
.handoff b { font: 500 10px var(--mono); color: var(--faint); text-transform: uppercase; letter-spacing: 0.1em; display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 3px; padding: 2px 7px; font: 12.5px var(--body); cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: background 0.2s, border-color 0.2s, box-shadow 0.2s; }
.chip:hover { border-color: var(--accent); }
.chip.entry { border-color: color-mix(in srgb, var(--task) 60%, transparent); color: var(--task); font-weight: 500; }
.chip.more { color: var(--dim); font-family: var(--mono); font-size: 11.5px; }
.chip.hot { background: var(--accent); color: var(--bg); border-color: var(--accent); box-shadow: 0 0 14px rgba(95, 216, 255, 0.55); }
.chip.entry.hot { background: var(--task); border-color: var(--task); box-shadow: 0 0 14px rgba(255, 181, 71, 0.5); }

/* arrows in the gaps: top row runs right, bottom row runs left */
.card.r::after, .card.l::after, .card.lr::after {
  position: absolute; top: 50%; transform: translateY(-50%); width: 34px; text-align: center;
  font: 500 18px var(--mono); color: var(--accent); opacity: 0.7;
}
.card.r::after { content: "→"; right: -35px; }
.card.l::after { content: "←"; right: -35px; }
.card.lr::after { content: "⇄"; right: -35px; color: var(--task); }

.lanes { display: grid; grid-template-columns: 1fr; gap: 6px; }
.lane { border: 1px solid var(--line); border-radius: 4px; padding: 7px 8px; display: flex; flex-direction: column; gap: 5px; background: var(--bg); transition: opacity 0.25s, border-color 0.25s; min-width: 0; }
.lane .card-head h3 { font-size: 11.5px; letter-spacing: 0.08em; }

.mid { display: flex; align-items: center; justify-content: center; padding: 8px 0; font: 500 11.5px/1.35 var(--mono); color: var(--dim); text-align: center; }
.mid.up { grid-area: up; flex-direction: column; gap: 2px; }
.mid.down { grid-area: down; flex-direction: column; gap: 2px; }
.mid .glyph { font-size: 18px; color: var(--accent); opacity: 0.7; }
.mid.up .glyph { color: var(--task); }
.dev { grid-area: dev; align-self: center; display: flex; align-items: center; gap: 10px; border: 1px dashed color-mix(in srgb, var(--task) 50%, transparent); border-radius: 999px; padding: 6px 14px; margin: 10px 0; }
.dev .chip { flex-shrink: 0; }
.dev p { margin: 0; font-size: 12px; color: var(--dim); }

.across { grid-area: across; margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.across > .lbl { font: 600 11px var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: 0.12em; }
.across-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.across .card { padding: 10px; gap: 8px; }
.across .card h3 { font-size: 12.5px; }

/* path and selection states */
.board.dim .card, .board.dim .lane, .board.dim .dev { opacity: 0.28; }
.board.dim .lit, .board.dim .card.lit-parent { opacity: 1; }
.board.dim .card.lit-parent > .card-head, .board.dim .card.lit-parent > .handoff { opacity: 0.5; }
.lit { border-color: var(--accent) !important; box-shadow: 0 0 0 1px rgba(95, 216, 255, 0.35), 0 0 22px rgba(95, 216, 255, 0.12); }
.focus { border-color: var(--accent) !important; box-shadow: 0 0 0 1px var(--accent), 0 0 30px rgba(95, 216, 255, 0.25) !important; }
.badges { position: absolute; top: -9px; right: 10px; display: flex; gap: 4px; }
.badge { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--bg); font: 600 11px/18px var(--mono); text-align: center; }
.badge.now { background: var(--task); box-shadow: 0 0 12px rgba(255, 181, 71, 0.7); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(95, 216, 255, 0.6); } 100% { box-shadow: 0 0 0 14px rgba(95, 216, 255, 0); } }
.pulse { animation: pulse 0.9s ease-out 2; }

/* console */
.console { min-width: 0; min-height: 0; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.console h2 { margin: 0; font: 600 19px/1.2 var(--display); letter-spacing: 0.03em; overflow-wrap: anywhere; }
.console p { margin: 0; }
.desc { color: #bcd3dc; font-size: 13.5px; }
.sec { display: flex; flex-direction: column; gap: 6px; }
.sec-lbl { font: 600 11px var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: 0.12em; display: flex; justify-content: space-between; }
.sec-lbl em { font-style: normal; color: var(--faint); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.row { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: baseline; text-align: left; background: none; border: 0; border-left: 2px solid transparent; padding: 4px 6px; cursor: pointer; border-radius: 0 3px 3px 0; }
.row:hover { background: rgba(95, 216, 255, 0.06); border-left-color: var(--accent); }
.row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.task span { color: var(--task); }
.row small { font: 11px var(--mono); color: var(--dim); }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font: 500 11px var(--mono); padding: 2px 7px; border: 1px solid var(--line); border-radius: 3px; color: var(--dim); }
.tag.task { color: var(--task); border-color: color-mix(in srgb, var(--task) 50%, transparent); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.stat { background: var(--bg); padding: 8px; display: flex; flex-direction: column; }
.stat b { font: 600 20px/1 var(--display); color: var(--accent); font-variant-numeric: tabular-nums; }
.stat span { font: 500 10px/1.3 var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px; }
.legend { display: grid; gap: 7px; font-size: 13px; color: var(--dim); }
.legend div { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 10px; }
.legend .chip { cursor: default; justify-self: start; }
.expert { border: 1px solid var(--line); border-radius: 4px; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.expert b { font: 600 12.5px var(--body); }
.back { align-self: flex-start; background: none; border: 1px solid var(--line); border-radius: 3px; padding: 2px 8px; cursor: pointer; font: 12px var(--mono); color: var(--dim); }
.back:hover { color: var(--accent); border-color: var(--accent); }

@media (max-width: 1180px) and (min-width: 861px) {
  .shell { grid-template-columns: minmax(0, 1fr) 300px; }
}
@media (max-width: 860px) {
  body { overflow: auto; }
  .shell { display: flex; flex-direction: column; height: auto; }
  main { overflow: visible; }
  .board { display: flex; flex-direction: column; gap: 30px; }
  .board > .mid, .board > .dev { display: none; }
  .board > .card::after {
    content: "↓"; position: absolute; right: auto; left: 50%; top: auto; bottom: -27px; transform: translateX(-50%);
    width: auto; white-space: nowrap; font: 500 18px var(--mono); color: var(--accent); opacity: 0.7;
  }
  .board > .card[data-rid="implement"]::after { content: "⇅"; color: var(--task); }
  .board > .card[data-rid="verify"]::after { content: "↓"; color: var(--accent); }
  .board > .card[data-rid="maintenance"]::after { content: "↺ back to product direction"; font-size: 12px; color: var(--task); bottom: -24px; }
  .across { margin-top: 0; }
  .across-grid { grid-template-columns: 1fr; }
  .across .card::after { content: none !important; }
  .steps { grid-template-columns: 1fr 1fr; }
  .play { margin-left: 0; }
  .console { overflow: visible; }
}
@media (prefers-reduced-motion: reduce) {
  .pulse { animation: none; }
  .card, .lane, .chip { transition: none; }
}
</style>

velopment/browser-extension-delivery","plugin":"browser-extension-development","name":"browser-extension-delivery","description":"Prepare or review Chrome MV3 release packages and Chrome Web Store readiness. Use for production ZIP contents, listing/privacy evidence, update compatibility and authorized upload/submission/publication; preserve existing CI and release policy.","role":"support","scope":"stack-specific","upstream":"","loads":[],"home":"expertise:browser-extension-development"},"browser-extension-development/browser-extension-development":{"id":"browser-extension-development/browser-extension-development","plugin":"browser-extension-development","name":"browser-extension-development","description":"Design, implement, debug or migrate Chrome Manifest V3 extensions. Use for extension entrypoints, background lifecycle, messaging, persistence and WXT/CRXJS integration; preserve the accepted UI framework and backend.","role":"support","scope":"stack-specific","upstream":"","loads":["browser-extension-development/browser-extension-security","browser-extension-development/browser-extension-testing","browser-extension-development/browser-extension-ui"],"home":"expertise:browser-extension-development"},"browser-extension-development/browser-extension-security":{"id":"browser-extension-development/browser-extension-security","plugin":"browser-extension-development","name":"browser-extension-security","description":"Design, implement or review Chrome MV3 permissions and extension trust boundaries. Use for manifest grants, content-script messaging, privileged fetch/injection, extension storage and browser-to-backend identity.","role":"support","scope":"stack-specific","upstream":"","loads":["browser-extension-development/browser-extension-delivery"],"home":"expertise:browser-extension-development"},"browser-extension-development/browser-extension-testing":{"id":"browser-extension-development/browser-extension-testing","plugin":"browser-extension-development","name":"browser-extension-testing","description":"Plan and execute Chrome MV3 unit, component and real-extension tests. Use for worker restart, popup/panel lifecycle, site permissions, messaging and production-package verification with a compatible browser driver.","role":"support","scope":"stack-specific","upstream":"","loads":["browser-extension-development/browser-extension-security","browser-extension-development/browser-extension-ui"],"home":"expertise:browser-extension-development"},"browser-extension-development/browser-extension-ui":{"id":"browser-extension-development/browser-extension-ui","plugin":"browser-extension-development","name":"browser-extension-ui","description":"Design, implement or assess Chrome extension experiences by matching user tasks to suitable UI patterns and browser surfaces. Use for extension information architecture, surface lifecycle, injected UI, permission states and assets; preserve the product's design system.","role":"support","scope":"stack-specific","upstream":"","loads":["browser-extension-development/browser-extension-testing"],"home":"expertise:browser-extension-development"},"database-development/database-design":{"id":"database-development/database-design","plugin":"database-development","name":"database-design","description":"Design or evolve stored data, constraints, transactions and migration behavior independently of a database engine. Use for persistence choices, schema changes, consistency boundaries and data lifecycle decisions.","role":"support","scope":"generic","upstream":"","loads":[],"home":"design"},"database-development/database-performance":{"id":"database-development/database-performance","plugin":"database-development","name":"database-performance","description":"Investigate database workload performance and compare improvements while preserving correctness and operating budgets. Use for latency, throughput, contention, connection or resource bottlenecks before choosing engine-specific tuning.","role":"support"," bugs":{"id":"development/diagnosing-bugs","plugin":"development","name":"diagnosing-bugs","description":"Diagnosis loop for hard bugs and performance regressions. Use when the user says \"diagnose\"/\"debug this\", or reports something broken/throwing/failing/slow.","role":"support","scope":"generic","upstream":"mattpocock-skills","loads":[],"home":"implement"},"development/differential-review":{"id":"development/differential-review","plugin":"development","name":"differential-review","description":"Performs security-focused differential review of code changes. Adapts analysis depth to codebase size, uses git blame for context, calculates blast radius by counting callers, checks test coverage of modified code, and generates a markdown report. Use when reviewing a PR, commit, or diff for security vulnerabilities, checking whether a change re-introduces a previously fixed bug, asking what else a change could break, or finding which modified code has no test covering it.","role":"support","scope":"generic","upstream":"trailofbits-skills","loads":[],"home":"review"},"development/domain-modeling":{"id":"development/domain-modeling","plugin":"development","name":"domain-modeling","description":"Build and sharpen a project's domain model. Use when discussing codebase terminology, writing or editing a GLOSSARY.md, or recording or editing an ADR.","role":"support","scope":"generic","upstream":"mattpocock-skills","loads":[],"home":"design"},"development/git-contributions":{"id":"development/git-contributions","plugin":"development","name":"git-contributions","description":"Develop a feature in an isolated Git worktree, make Conventional Commits and publish a concise pull request to the correct repository. Apply by default when starting feature work, continuing a feature branch, committing changes or preparing a PR; respect plan-only requests and existing contribution conventions.","role":"support","scope":"generic","upstream":"","loads":["development/project-conventions"],"ho chers and general code linters miss — untrusted-input script injection, privileged triggers running fork code, mutable action references, and over-scoped tokens. Use this skill when asked to review, audit, harden, or secure a GitHub Actions workflow, when writing a new workflow, or for any request like \"is this workflow safe?\", \"review my CI for security issues\", \"why is pull_request_target dangerous here?\", \"pin my actions\", or \"lock down GITHUB_TOKEN permissions\". Covers script injection via ${{ }} interpolation, pull_request_target / workflow_run privilege escalation, SHA-pinning of third-party actions, least-privilege permissions, GITHUB_ENV/GITHUB_OUTPUT injection, secret exposure, OIDC over long-lived credentials, and self-hosted runner exposure on public repositories.","role":"support","scope":"generic","upstream":"github-awesome-copilot","loads":[],"home":"expertise:development-tooling"},"development-tooling/performance-testing":{"id":"development-tooling/performance-testing","plugin":"development-tooling","name":"performance-testing","description":"Design, implement, run or review k6 load and performance checks for application journeys locally, against an application started on a CI runner, or against a deployed non-production environment. Use for latency, concurrency, throughput, saturation and performance regressions; preserve target authority and existing tooling.","role":"support","scope":"stack-specific","upstream":"","loads":[],"home":"expertise:development-tooling"},"development-tooling/playwright-cli":{"id":"development-tooling/playwright-cli","plugin":"development-tooling","name":"playwright-cli","description":"Automate browser interactions, test web pages and work with Playwright tests.","role":"support","scope":"generic","upstream":"microsoft-playwright-cli","loads":[],"home":"expertise:development-tooling"},"development-tooling/supply-chain-risk-auditor":{"id":"development-tooling/supply-chain-risk-auditor","plugin":"development-toolin ,"upstream":"","loads":[],"home":"docs"},"visualization/presentation-building":{"id":"visualization/presentation-building","plugin":"visualization","name":"presentation-building","description":"Create or refine portable single-file HTML slide decks, including narrative, visual direction, responsive/fullscreen layout and optional timeline navigation. Use for HTML presentation work; preserve requested formats and existing deck identity.","role":"task","scope":"generic","upstream":"","loads":[],"home":"docs"},"visualization/system-flow-explorer":{"id":"visualization/system-flow-explorer","plugin":"visualization","name":"system-flow-explorer","description":"Build an explorable, standalone HTML architecture and message-flow explorer from repository evidence or a proposed design. Use when users want to explore a service or repository's architecture, capabilities, dataflow, request lifecycle, sequence messages, or C4 context/container/component views; also use for brainstorming and refining proposed system designs with these views. Keep user scenarios, diagram views, and architecture depth separate. Not for unrelated UI design, generic charts, or application feature implementation.","role":"task","scope":"generic","upstream":"","loads":[],"home":"docs"}},"plugins":{"ai-adk-development":"Google ADK architecture and agent implementation.","ai-development":"Provider-independent AI application design, testing/evaluation and operations; models, context, tools, harnesses and protocols.","ai-langchain-development":"LangChain and LangGraph implementation, dependencies and persistence.","ai-python-development":"Python provider/FastMCP integration, DeepEval testing and Python OpenTelemetry observability.","backend-development":"Framework-independent service authority, state, durable work, failure and consumer contracts.","backend-python-development":"Python, FastAPI, SQLAlchemy, Alembic, persistence and Python automation implementation.","browser-extension-development":"Chrome Manif ess development across application stacks; contextual framework selection and verification.","strategy":"Business strategy, product priorities and evidence-based product learning.","typescript-development":"TypeScript engineering for accepted runtimes, libraries, services and clients; module/package contracts, validation and verification independent of React.","visualization":"Architecture diagrams, interactive system explanation and presentations."}}/*DATA-END*/;
const { flow, skills, plugins } = DATA;
const SHOW = 2;

/* ---------- regions: stages, maintenance lanes, across groups ---------- */
const regions = {};
flow.stages.forEach(s => {
  regions[s.id] = { ...s, kind: "stage" };
  (s.lanes || []).forEach(l => regions[l.id] = { ...l, kind: "lane", parent: s.id });
});
flow.across.forEach(g => regions[g.id] = { ...g, kind: "across" });
const stageIndex = Object.fromEntries(flow.stages.map((s, i) => [s.id, i]));
const name = id => skills[id] ? skills[id].name : id;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const isTask = id => skills[id] && skills[id].role === "task";
const expertiseFor = stageId => flow.expertise.filter(e => e.stages.includes(stageId));
const expertiseSkills = e => e.only || Object.values(skills).filter(s => s.plugin === e.plugin).map(s => s.id);
const homeLabel = id => {
  const h = skills[id]?.home || "";
  if (h === "end-to-end") return "end to end";
  if (h.startsWith("expertise:")) return flow.expertise.find(e => "expertise:" + e.plugin === h)?.label || "expertise";
  return regions[h]?.label || h;
};

/* ---------- board ---------- */
const board = document.getElementById("board");
const arrows = { direction: "r", requirements: "r", design: "r", verify: "lr", release: "l", maintenance: "l" };
function chipsHtml(r) {
  const entry = r.entry.map(id => `<button type="button" class="chip entry" data-skill="${id}">${esc(name(id))}</button>`);
  const shown = r.support.slice(0, SHOW).map(id => `<button type="button" class="chip" data-skill="${id}">${esc(name(id))}</button>`);
  const extra = r.support.length - SHOW;
  if (extra > 0) shown.push(`<button type="button" class="chip more" data-region="${r.id}">+${extra} more</button>`);
  return `<div class="chips">${entry.join("")}${shown.join("")}</div>`;
}
function headHtml(r, num) {
  return `<button type="button" class="card-head" data-region="${r.id}">${num != null ? `<span class="num">${String(num).padStart(2, "0")}</span>` : ""}<h3>${esc(r.label)}</h3></button>`;
}
let html = "";
flow.stages.forEach(s => {
  const arrow = arrows[s.id] ?? "";
  const lanes = s.lanes ? `<div class="lanes">${s.lanes.map(l => `<div class="lane" data-rid="${l.id}">${headHtml(l)}${chipsHtml({ ...l, support: [] })}</div>`).join("")}</div>` : chipsHtml(s);
  html += `<section class="card ${arrow}" data-rid="${s.id}" style="grid-area:${s.id}"><div class="badges"></div>${headHtml(s, s.number)}${lanes}<p class="handoff"><b>Hands on</b>${esc(s.handoff)}</p></section>`;
});
const loopUp = flow.loops.find(l => l.to === "direction");
html += `<div class="mid up"><span class="glyph">↑</span><span>${esc(loopUp ? loopUp.label : "")}</span></div>`;
html += `<div class="dev" data-rid="develop"><button type="button" class="chip entry" data-skill="${flow.endToEnd.skill}">${esc(name(flow.endToEnd.skill))}</button><p>${esc(flow.endToEnd.label)}</p></div>`;
html += `<div class="mid down"><span class="glyph">↓</span><span>Plan hands work to implementation</span></div>`;
html += `<section class="across"><span class="lbl">Across every phase</span><div class="across-grid">${flow.across.map(g => `<section class="card" data-rid="${g.id}"><div class="badges"></div>${headHtml(g)}${chipsHtml({ ...g, support: g.entry.length > 1 ? [] : g.support })}</section>`).join("")}</div></section>`;
board.innerHTML = html;
/* lanes and multi-entry groups fold their support into "+N" so the board stays calm */
board.querySelectorAll(".lane").forEach(el => {
  const l = regions[el.dataset.rid];
  const chips = el.querySelector(".chips");
  chips.querySelectorAll(".chip:not(.entry)").forEach(c => c.remove());
  if (l.support.length) chips.insertAdjacentHTML("beforeend", `<button type="button" class="chip more" data-region="${l.id}">+${l.support.length}</button>`);
});
board.querySelectorAll(".across .card").forEach(el => {
  const g = regions[el.dataset.rid];
  const chips = el.querySelector(".chips");
  chips.querySelectorAll(".chip:not(.entry)").forEach(c => c.remove());
  if (g.support.length) chips.insertAdjacentHTML("beforeend", `<button type="button" class="chip more" data-region="${g.id}">+${g.support.length}</button>`);
});

/* ---------- console ---------- */
const con = document.getElementById("console");
let history = [];
function row(id, extra) {
  return `<li><button type="button" class="row${isTask(id) ? " task" : ""}" data-skill="${id}"><span>${esc(name(id))}</span><small>${esc(extra ?? "")}</small></button></li>`;
}
function section(label, items, empty) {
  return `<div class="sec"><div class="sec-lbl">${label}<em>${items.length || ""}</em></div>${items.length ? `<ul class="list">${items.join("")}</ul>` : `<p class="desc" style="color:var(--faint)">${empty}</p>`}</div>`;
}
function showHome() {
  const all = Object.values(skills);
  const tasks = all.filter(s => s.role === "task").length;
  con.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${all.length}</b><span>skills</span></div>
      <div class="stat"><b>${flow.stages.length}</b><span>stages</span></div>
      <div class="stat"><b>${tasks}</b><span>entry tasks</span></div>
      <div class="stat"><b>${flow.expertise.length}</b><span>tech stacks</span></div>
    </div>
    <div class="sec"><div class="sec-lbl">How to read it</div>
      <p class="desc">Work moves along the top row, drops into implementation, and comes back along the bottom row to running the system. Maintenance feeds learning back into direction. Each card says what it hands on to the next.</p>
    </div>
    <div class="legend">
      <div><span class="chip entry">refine</span>A task you start by asking for it</div>
      <div><span class="chip">grilling</span>Supporting skill the agent pulls in</div>
      <div><span class="chip more">+3 more</span>Folded skills; click to list them</div>
    </div>
    <div class="sec"><div class="sec-lbl">Technical expertise</div>
      <p class="desc">Stack skills (React, Python, Go, PostgreSQL, Kubernetes, AI frameworks) stay off the board. Click a stage to see which ones apply there.</p>
    </div>
    <p class="desc" style="color:var(--dim)">Built from documentation/sdlc.md and every SKILL.md. Run scripts/build_skill_flow.py to refresh.</p>`;
}
function showRegion(id) {
  const r = regions[id];
  const stageId = r.kind === "lane" ? r.parent : id;
  const st = regions[stageId];
  const prev = r.kind === "stage" && stageIndex[id] > 0 ? flow.stages[stageIndex[id] - 1] : null;
  const exp = r.kind === "across" ? [] : expertiseFor(stageId);
  const lanesHtml = r.lanes ? `<div class="sec"><div class="sec-lbl">Responsibilities</div><ul class="list">${r.lanes.map(l => `<li><button type="button" class="row" data-region="${l.id}"><span>${esc(l.label)}</span><small>${l.entry.length + l.support.length} skills</small></button></li>`).join("")}</ul></div>` : "";
  con.innerHTML = `
    ${history.length ? `<button type="button" class="back" id="back">← Back</button>` : ""}
    <div class="tags"><span class="tag">${r.kind === "lane" ? "Maintenance · responsibility" : r.kind === "across" ? "Across every phase" : st.number ? "Phase " + st.number : "Before the phases"}</span></div>
    <h2>${esc(r.label)}</h2>
    ${r.summary ? `<p class="desc">${esc(r.summary)}</p>` : ""}
    ${prev ? `<div class="sec"><div class="sec-lbl">Receives</div><p class="desc">${esc(prev.handoff)}</p></div>` : ""}
    ${r.handoff ? `<div class="sec"><div class="sec-lbl">Hands on</div><p class="desc">${esc(r.handoff)}</p></div>` : ""}
    ${lanesHtml}
    ${r.lanes ? "" : section("Entry tasks", r.entry.map(id => row(id, "task")), "None: reached through other skills")}
    ${r.lanes ? "" : section("Supporting skills", r.support.map(id => row(id, skills[id].upstream ? "upstream" : "")), "None")}
    ${exp.length ? `<div class="sec"><div class="sec-lbl">Matching expertise for this stage<em>${exp.length}</em></div>${exp.map(e => `<div class="expert"><b>${esc(e.label)}</b><ul class="list">${expertiseSkills(e).map(id => row(id, "")).join("")}</ul></div>`).join("")}</div>` : ""}`;
}
function showSkill(id) {
  const s = skills[id];
  const loadedBy = Object.values(skills).filter(o => o.loads.includes(id)).map(o => o.id);
  const inPaths = [];
  flow.paths.forEach(p => {
    if (p.entry === id) inPaths.push(`<li><button type="button" class="row" data-path="${p.id}"><span>${esc(p.label)}</span><small>starts here</small></button></li>`);
    p.steps.forEach((st, i) => { if (st.skills.includes(id)) inPaths.push(`<li><button type="button" class="row" data-path="${p.id}"><span>${esc(p.label)}</span><small>step ${i + 1}</small></button></li>`); });
  });
  const home = s.home;
  con.innerHTML = `
    ${history.length ? `<button type="button" class="back" id="back">← Back</button>` : ""}
    <div class="tags">
      <span class="tag ${s.role === "task" ? "task" : ""}">${s.role === "task" ? "entry task" : "supporting"}</span>
      <span class="tag">${esc(s.plugin)}</span>
      <span class="tag">${esc(s.scope)}</span>
      <span class="tag">${s.upstream ? "upstream · " + esc(s.upstream) : "authored here"}</span>
    </div>
    <h2>${esc(s.name)}</h2>
    <p class="desc">${esc(s.description)}</p>
    <div class="sec"><div class="sec-lbl">Lives in</div><ul class="list"><li><button type="button" class="row" ${regions[home] ? `data-region="${home}"` : ""}><span>${esc(homeLabel(id))}</span><small>${regions[home] ? "open" : ""}</small></button></li></ul></div>
    ${section("Loads directly", s.loads.map(t => row(t, homeLabel(t))), "Loads no other skill by link")}
    ${section("Loaded by", loadedBy.map(t => row(t, homeLabel(t))), "No skill links here directly")}
    ${inPaths.length ? section("On starting paths", inPaths, "") : ""}`;
}
let current = null;
function open(kind, id, push = true) {
  if (push && current) history.push(current);
  current = { kind, id };
  if (kind === "region") showRegion(id); else if (kind === "skill") showSkill(id); else { history = []; showHome(); }
  con.scrollTop = 0;
  focusBoard(kind, id);
  const b = document.getElementById("back");
  if (b) b.addEventListener("click", () => { const prev = history.pop(); open(prev ? prev.kind : "home", prev ? prev.id : null, false); });
}

/* ---------- highlighting ---------- */
function clearMarks() {
  board.querySelectorAll(".lit,.focus,.lit-parent").forEach(e => e.classList.remove("lit", "focus", "lit-parent"));
  board.querySelectorAll(".chip.hot").forEach(c => c.classList.remove("hot"));
}
function regionEl(id) { return id === "develop" ? board.querySelector(".dev") : board.querySelector(`[data-rid="${id}"]`); }
function lightRegion(id, cls = "lit") {
  const el = regionEl(id);
  if (!el) return;
  el.classList.add(cls);
  if (el.classList.contains("lane")) el.closest(".card").classList.add("lit-parent");
}
function heat(ids) { ids.forEach(id => board.querySelectorAll(`.chip[data-skill="${id}"]`).forEach(c => c.classList.add("hot"))); }
function focusBoard(kind, id) {
  if (activePath) return;
  clearMarks();
  board.classList.remove("dim");
  if (kind === "region") { regionEl(id)?.classList.add("focus"); }
  if (kind === "skill") {
    const h = skills[id].home;
    heat([id]);
    const el = h === "end-to-end" ? regionEl("develop") : regionEl(h);
    if (el) { el.classList.add("focus"); }
    else if (h.startsWith("expertise:")) {
      const e = flow.expertise.find(x => "expertise:" + x.plugin === h);
      board.classList.add("dim");
      e.stages.forEach(s => lightRegion(s));
    }
  }
}

/* ---------- paths ---------- */
const pathRow = document.getElementById("pathRow");
const stepsEl = document.getElementById("steps");
const playBtn = document.getElementById("playBtn");
const clearBtn = document.getElementById("clearBtn");
let activePath = null, stepNow = -1, timer = null;
const playWrap = pathRow.querySelector(".play");
flow.paths.forEach(p => playWrap.insertAdjacentHTML("beforebegin", `<button type="button" class="pbtn" data-path="${p.id}" aria-pressed="false">${esc(p.label)}</button>`));
function setPath(id) {
  stopPlay();
  activePath = flow.paths.find(p => p.id === id) || null;
  pathRow.querySelectorAll(".pbtn").forEach(b => b.setAttribute("aria-pressed", b.dataset.path === id && !!activePath));
  playBtn.disabled = clearBtn.disabled = !activePath;
  stepNow = -1;
  renderPath();
  if (activePath) open("skill", activePath.entry);
  else open("home", null, false);
}
function renderPath() {
  clearMarks();
  board.querySelectorAll(".badges").forEach(b => b.innerHTML = "");
  if (!activePath) { board.classList.remove("dim"); stepsEl.hidden = true; return; }
  board.classList.add("dim");
  stepsEl.hidden = false;
  stepsEl.innerHTML = activePath.steps.map((s, i) => `<button type="button" class="step${i === stepNow ? " now" : ""}" data-step="${i}"><b>${i + 1}</b><span>${esc(s.label)}</span></button>`).join("");
  const entryEl = activePath.entry === flow.endToEnd.skill ? regionEl("develop") : null;
  if (entryEl) entryEl.classList.add("lit");
  heat([activePath.entry]);
  activePath.steps.forEach((s, i) => {
    const show = stepNow < 0 || i === stepNow;
    [s.stage, ...(s.also || [])].forEach(r => {
      if (show) lightRegion(r, i === stepNow ? "focus" : "lit");
      const el = regionEl(r);
      const host = el && (el.classList.contains("lane") ? el.closest(".card") : el);
      const badges = host && host.querySelector(".badges");
      if (badges && !badges.querySelector(`[data-n="${i}"]`)) badges.insertAdjacentHTML("beforeend", `<span class="badge${i === stepNow ? " now" : ""}" data-n="${i}">${i + 1}</span>`);
    });
    if (show) heat(s.skills);
  });
}
function goStep(i) {
  stepNow = i;
  renderPath();
  const s = activePath.steps[i];
  const el = regionEl(s.stage);
  if (el) { el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse"); el.scrollIntoView({ block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }
  const r = regions[s.stage];
  if (r) { current = null; history = []; showRegion(s.stage); }
}
function stopPlay() { clearInterval(timer); timer = null; playBtn.textContent = "▶ Play"; }
playBtn.addEventListener("click", () => {
  if (timer) { stopPlay(); return; }
  playBtn.textContent = "❚❚ Pause";
  let i = stepNow + 1 >= activePath.steps.length ? 0 : stepNow + 1;
  goStep(i);
  timer = setInterval(() => {
    i += 1;
    if (i >= activePath.steps.length) { stopPlay(); return; }
    goStep(i);
  }, 2000);
});
clearBtn.addEventListener("click", () => setPath(null));
stepsEl.addEventListener("click", e => { const b = e.target.closest("[data-step]"); if (b) { stopPlay(); goStep(+b.dataset.step); } });

/* ---------- clicks everywhere ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-skill],[data-region],[data-path]");
  if (!t || t.closest(".search")) return;
  if (t.dataset.path && t.classList.contains("pbtn")) { setPath(activePath && activePath.id === t.dataset.path ? null : t.dataset.path); return; }
  if (t.dataset.path) { setPath(t.dataset.path); return; }
  if (t.dataset.skill && skills[t.dataset.skill]) open("skill", t.dataset.skill);
  else if (t.dataset.region && regions[t.dataset.region]) open("region", t.dataset.region);
});

/* ---------- search ---------- */
const q = document.getElementById("q"), qres = document.getElementById("qres");
let kb = 0;
function renderSearch() {
  const v = q.value.trim().toLowerCase();
  if (!v) { qres.hidden = true; return; }
  const hits = Object.values(skills).filter(s => s.name.includes(v) || s.plugin.includes(v) || s.description.toLowerCase().includes(v))
    .sort((a, b) => (b.name.startsWith(v) - a.name.startsWith(v)) || (b.name.includes(v) - a.name.includes(v)) || a.name.localeCompare(b.name)).slice(0, 10);
  qres.hidden = false;
  kb = Math.min(kb, Math.max(hits.length - 1, 0));
  qres.innerHTML = hits.length ? hits.map((s, i) => `<li><button type="button" data-hit="${s.id}" class="${i === kb ? "kb" : ""}"><span>${esc(s.name)}</span><small>${esc(homeLabel(s.id))}</small></button></li>`).join("") : `<li style="padding:6px 8px;color:var(--dim)">No skill matches “${esc(v)}”</li>`;
}
function pick(id) {
  q.value = ""; qres.hidden = true;
  if (activePath) setPath(null);
  open("skill", id);
  const chip = board.querySelector(`.chip[data-skill="${id}"]`) || regionEl(skills[id].home);
  if (chip) { chip.scrollIntoView({ block: "center", behavior: "smooth" }); chip.classList.remove("pulse"); void chip.offsetWidth; chip.classList.add("pulse"); }
}
q.addEventListener("input", () => { kb = 0; renderSearch(); });
q.addEventListener("keydown", e => {
  const items = [...qres.querySelectorAll("[data-hit]")];
  if (e.key === "ArrowDown") { kb = Math.min(kb + 1, items.length - 1); renderSearch(); e.preventDefault(); }
  if (e.key === "ArrowUp") { kb = Math.max(kb - 1, 0); renderSearch(); e.preventDefault(); }
  if (e.key === "Enter" && items[kb]) pick(items[kb].dataset.hit);
  if (e.key === "Escape") { q.value = ""; qres.hidden = true; }
});
qres.addEventListener("click", e => { const b = e.target.closest("[data-hit]"); if (b) pick(b.dataset.hit); });
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  if (e.key === "Escape" && document.activeElement !== q) { if (activePath) setPath(null); else open("home", null, false); }
});

open("home", null, false);
</script>
