name: Publish / Claude Code marketplace
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-claude-marketplace
  cancel-in-progress: true
jobs:
  publish:
    name: Build bundles and publish the claude-marketplace branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Build every pinned plugin
        run: python scripts/build_plugins.py --all --destination "$RUNNER_TEMP/marketplace"
      - name: Check complete inventory and local resources
        run: python scripts/check_collection.py --built "$RUNNER_TEMP/marketplace"
      - name: Add the Claude Code marketplace manifest
        run: python scripts/build_claude_marketplace.py --built "$RUNNER_TEMP/marketplace"
      - name: Publish generated output
        working-directory: ${{ runner.temp }}/marketplace
        run: |
          git init -q -b claude-marketplace
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build: claude marketplace from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" claude-marketplace
